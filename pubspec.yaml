name: gabel
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  assets:
      - assets/images/
  fonts:
      - family: Proza_Libre
        fonts:
          - asset: assets/fonts/Proza_Libre/ProzaLibre-Regular.ttf
            weight: 400
          - asset: assets/fonts/Proza_Libre/ProzaLibre-Medium.ttf
            weight: 500
          - asset: assets/fonts/Proza_Libre/ProzaLibre-SemiBold.ttf
            weight: 600
          - asset: assets/fonts/Proza_Libre/ProzaLibre-Bold.ttf
            weight: 700