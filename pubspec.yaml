name: gabel
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  get_it: ^9.3.0
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  assets:
      - assets/images/
      - .env
  fonts:
      - family: ProzaLibre
        fonts:
          - asset: assets/fonts/ProzaLibre/ProzaLibre-Regular.ttf
            weight: 400
          - asset: assets/fonts/ProzaLibre/ProzaLibre-Medium.ttf
            weight: 500
          - asset: assets/fonts/ProzaLibre/ProzaLibre-SemiBold.ttf
            weight: 600
          - asset: assets/fonts/ProzaLibre/ProzaLibre-Bold.ttf
            weight: 700